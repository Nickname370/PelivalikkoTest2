body{
    margin:0;

    font-family:Arial,sans-serif;
    overflow:hidden;

.container{
    text-align:center;
    background:rgba(0,0,0,0.7);
    padding:40px;
    border-radius:20px;

h1{

}

.chess-icons{
    font-size:50px;
    margin-bottom:25px;
}

button{
    display:block;
    width:260px;
    margin:12px auto;
    padding:15px;
    font-size:22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.25s;
    font-weight:bold;
}


.back{
    background:#444;
    color:white;
}

button:hover{
    transform:scale(1.05);
}

.board-bg{
    position:absolute;
    inset:0;
    opacity:0.08;
    background:
    repeating-linear-gradient(
        0deg,
        #fff 0px,
        #fff 60px,
        #000 60px,
        #000 120px
    ),
    repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 60px,
        rgba(255,255,255,0.3) 60px,
        rgba(255,255,255,0.3) 120px
    );
}
</style>
