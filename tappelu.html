<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tappelu</title>
<style>
body{
	margin:0;
	overflow:hidden;
	font-family:Arial;
	background:linear-gradient(#87ceeb,#6cc56c);
}

#ui{
	position:absolute;
	left:230px;
	top:10px;
	color:white;
	font-size:22px;
	text-shadow:2px 2px 4px #000;
}

#restart{
	position:absolute;
	top:70px;
	left:10px;
	padding:10px 16px;
	font-size:18px;
	display:none;
}
canvas{display:block;}
</style>
</head>
<body>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
  <button style="position:absolute; bottom:10px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<div id="ui">WASD = liiku | Hiiren vasen tai välilyönti = lyö</div>
<button id="restart">Pelaa uudestaan</button>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const restartBtn=document.getElementById("restart");

function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let started=false;
let gameOver=false;

const keys={};

let player, enemy;

function resetGame(){
 player={x:200,y:350,hp:100,attacking:false,attackTimer:0};
 enemy={x:900,y:350,hp:100,attacking:false,attackTimer:0};
 started=false;
 gameOver=false;
 restartBtn.style.display="none";
}
resetGame();

function attack(){
 if(gameOver || !started) return;
 if(player.attackTimer>0) return;

 player.attacking=true;
 player.attackTimer=18;

 const d=Math.hypot(player.x-enemy.x,player.y-enemy.y);
 if(d<120){
   enemy.hp=Math.max(0,enemy.hp-15);
 }
}

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if(["w","a","s","d"].includes(e.key.toLowerCase())){
   started=true;
 }

 if(e.code==="Space"){
   attack();
 }
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousedown",e=>{
 if(e.button===0) attack();
});

restartBtn.onclick=()=>resetGame();

function drawHP(x,y,hp,color){
 ctx.fillStyle="black";
 ctx.fillRect(x,y,200,24);
 ctx.fillStyle=color;
 ctx.fillRect(x,y,hp*2,24);
 ctx.strokeStyle="white";
 ctx.strokeRect(x,y,200,24);
}

function drawSword(x1,y1,x2,y2){
 ctx.strokeStyle="silver";
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

function drawFighter(x,y,color){
 ctx.strokeStyle=color;
 ctx.lineWidth=6;

 ctx.beginPath(); ctx.arc(x,y-60,25,0,Math.PI*2); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x,y-35); ctx.lineTo(x,y+50); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x-30,y); ctx.lineTo(x+30,y); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x,y+50); ctx.lineTo(x-25,y+100); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x,y+50); ctx.lineTo(x+25,y+100); ctx.stroke();
}

function loop(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="#4caf50";
 ctx.fillRect(0,canvas.height-180,canvas.width,180);

 drawHP(20,20,player.hp,"lime");
 drawHP(canvas.width-220,20,enemy.hp,"red");

 if(!gameOver && started){

   if(keys["w"]) player.y-=5;
   if(keys["s"]) player.y+=5;
   if(keys["a"]) player.x-=5;
   if(keys["d"]) player.x+=5;

   const dx=player.x-enemy.x;
   const dy=player.y-enemy.y;
   const dist=Math.hypot(dx,dy);

   if(dist>90){
     enemy.x+=dx/dist*2;
     enemy.y+=dy/dist*2;
   }

   if(dist<100 && enemy.attackTimer<=0){
     enemy.attacking=true;
     enemy.attackTimer=22;
     player.hp=Math.max(0,player.hp-10);
   }

   if(player.attackTimer>0){
     player.attackTimer--;
     if(player.attackTimer===0) player.attacking=false;
   }

   if(enemy.attackTimer>0){
     enemy.attackTimer--;
     if(enemy.attackTimer===0) enemy.attacking=false;
   }
 }

 drawFighter(player.x,player.y,"blue");
 drawFighter(enemy.x,enemy.y,"red");

 drawSword(player.x,player.y,player.x+(player.attacking?90:60),player.y);
 drawSword(enemy.x,enemy.y,enemy.x-(enemy.attacking?90:60),enemy.y);

 if(!started && !gameOver){
   ctx.fillStyle="white";
   ctx.font="48px Arial";
   ctx.textAlign="center";
   ctx.fillText("Liiku WASD:llä aloittaaksesi", canvas.width/2, 150);
 }

 if((player.hp<=0 || enemy.hp<=0) && !gameOver){
   gameOver=true;
   restartBtn.style.display="block";
 }

 if(gameOver){
   ctx.fillStyle="white";
   ctx.font="80px Arial";
   ctx.textAlign="center";
   ctx.fillText(enemy.hp<=0?"VOITIT!":"HÄVISIT!", canvas.width/2, 180);
 }

 requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
