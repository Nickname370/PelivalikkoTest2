<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaappaamaan Mene</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#222;
}

#game{
    display:block;
    background:#6ecb63;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px;
    border-radius:10px;
}

#message{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    color:white;
    padding:10px 20px;
    border-radius:10px;
}
</style>
</head>

<body>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
<button style="
position:absolute;
top:20px;
right:20px;
padding:10px 14px;
font-size:16px;
cursor:pointer;">
⬅️ Takaisin
</button>
</a>

<canvas id="game"></canvas>
<div id="ui">
    <div>Kaappauspallot: <span id="balls">10</span></div>
    <div>Kaapattuja olioita: <span id="captured">0</span></div>
    <div>Voitot: <span id="wins">0</span></div>
</div>

<div id="message">
    WASD = Liiku | E = Torni | F = Kaappaa | T = Taistele | N = Kokoelma
</div>

<div id="collection" style="
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:700px;
height:500px;
overflow:auto;
background:white;
color:black;
padding:20px;
border:5px solid black;
z-index:1000;
">
    <h2>Napatut oliot</h2>

    <div id="collectionList"></div>

    <br>

    <button onclick="closeCollection()">Sulje</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const TILE = 40;
const MAP_W = 50;
const MAP_H = 50;

const map = [];
for(let y = 0; y < MAP_H; y++){
    map[y] = [];

    for(let x = 0; x < MAP_W; x++){
        map[y][x] = Math.random() < 0.15 ? 1 : 0; // 1 = vesi
    }
}

const player = {
    x: 200,
    y: 200,
    size: 25,
    speed: 4
};

let captureBalls = 10;
let captured = 0;
let wins = 0;

const monsters = [];
const towers = [];
const balloons = [];
const capturedMonsters = [];

function rand(a, b){
    return Math.random() * (b - a) + a;
}

const colors = [
    "#ff4444",
    "#4488ff",
    "#ffee44",
    "#ff44ff",
    "#44ff88"
];

const names = [
    "Möhkäle",
    "Kuolaaja",
    "Mörisijä",
    "Velli",
    "Sipuliini",
    "Inisijä",
    "Aavistus",
    "Mössö",
    "Pyromanaaja",
    "Tölkkis",
	"Torkkuli",
	"Ruttuinen"
];
for(let i = 0; i < 35; i++){

    const type = Math.floor(Math.random() * 3);

    monsters.push({
        x: rand(100, 1900),
        y: rand(100, 1900),
        type,
        color: colors[Math.floor(Math.random() * colors.length)],
        captured: false,
        level: Math.floor(Math.random() * 100) + 1,
        name: names[Math.floor(Math.random() * names.length)]
    });
}

for(let i = 0; i < 10; i++){

    towers.push({
        x: rand(100, 1900),
        y: rand(100, 1900)
    });
}

for(let i = 0; i < 6; i++){

    balloons.push({
        x: rand(100, 1900),
        y: rand(100, 1900),
        hp: 3
    });
}

const keys = {};

addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function show(text){
    document.getElementById("message").textContent = text;
}
function dist(a, b, c, d){
    return Math.hypot(a - c, b - d);
}

function openCollection(){

    const list = document.getElementById("collectionList");

    if(!list) return;

    list.innerHTML = "";

    if(capturedMonsters.length === 0){
        list.innerHTML = "<p>Ei vielä napattuja olioita.</p>";
    }

    capturedMonsters.forEach(mon => {

        let shape = "⚪";

        if(mon.type === 1) shape = "🟦";
        if(mon.type === 2) shape = "🔺";

        list.innerHTML += `
        <div style="
            border:1px solid black;
            margin:8px;
            padding:10px;
            font-size:20px;">
            ${shape}
            <b>${mon.name}</b><br>
            LVL ${mon.level}
        </div>
        `;
    });

    document.getElementById("collection").style.display = "block";
}

function closeCollection(){
    document.getElementById("collection").style.display = "none";
}

function movePlayer(){

    let nx = player.x;
    let ny = player.y;
    if(keys["w"]) ny -= player.speed;
    if(keys["s"]) ny += player.speed;
    if(keys["a"]) nx -= player.speed;
    if(keys["d"]) nx += player.speed;

    const tx = Math.floor(nx / TILE);
    const ty = Math.floor(ny / TILE);

    if(
        tx >= 0 &&
        ty >= 0 &&
        tx < MAP_W &&
        ty < MAP_H &&
        map[ty][tx] === 0
    ){
        player.x = nx;
        player.y = ny;
    }
}

function captureMonster(){

    if(captureBalls <= 0){
        show("Ei kaappauspalloja!");
        return;
    }

    for(const m of monsters){

        if(m.captured) continue;

        if(dist(player.x, player.y, m.x, m.y) < 60){

            captureBalls--;

            document.getElementById("balls").textContent =
                captureBalls;

            if(Math.random() < 0.75){

                m.captured = true;
                captured++;

                capturedMonsters.push({
                    name: m.name,
                    level: m.level,
                    type: m.type,
                    color: m.color
                });
                document.getElementById("captured").textContent =
                    captured;

                show("Olio kaapattu!");

            }else{

                show("Olio karkasi!");
            }

            return;
        }
    }
}

function useTower(){

    for(const t of towers){

        if(dist(player.x, player.y, t.x, t.y) < 70){

            const gain =
                3 + Math.floor(Math.random() * 4);

            captureBalls += gain;

            document.getElementById("balls").textContent =
                captureBalls;

            show("Sait " + gain + " kaappauspalloa!");

            return;
        }
    }
}

function battleBalloon(){

    if(captured <= 0){

        show("Tarvitset napatun olion!");

        return;
    }

    for(const b of balloons){

        if(b.hp <= 0) continue;

        if(dist(player.x, player.y, b.x, b.y) < 100){
		            if(Math.random() < 0.7){

                b.hp--;

                if(b.hp <= 0){

                    wins++;

                    document.getElementById("wins").textContent =
                        wins;

                    show("Voitit kuumailmapalloryhmän!");

                }else{

                    show("Osuma!");
                }

            }else{

                show("Hyökkäys epäonnistui!");
            }

            return;
        }
    }
}

addEventListener("keydown", e => {

    if(e.key.toLowerCase() === "f"){
        captureMonster();
    }

    if(e.key.toLowerCase() === "e"){
        useTower();
    }

    if(e.key.toLowerCase() === "n"){
        openCollection();
    }

    if(e.key.toLowerCase() === "t"){
        battleBalloon();
    }
});

function drawMonster(m){

    ctx.fillStyle = m.color;

    if(m.type === 0){
	        ctx.beginPath();
        ctx.arc(
            m.x,
            m.y,
            15,
            0,
            Math.PI * 2
        );
        ctx.fill();

    }else if(m.type === 1){

        ctx.fillRect(
            m.x - 15,
            m.y - 15,
            30,
            30
        );

    }else{

        ctx.beginPath();
        ctx.moveTo(m.x, m.y - 18);
        ctx.lineTo(m.x - 18, m.y + 18);
        ctx.lineTo(m.x + 18, m.y + 18);
        ctx.closePath();
        ctx.fill();
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const camX =
        player.x - canvas.width / 2;

    const camY =
        player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    for(let y = 0; y < MAP_H; y++){
	        for(let x = 0; x < MAP_W; x++){

            if(map[y][x] === 0){
                ctx.fillStyle = "#5fbf58";
            }else{
                ctx.fillStyle = "#3b82f6";
            }

            ctx.fillRect(
                x * TILE,
                y * TILE,
                TILE,
                TILE
            );
        }
    }

    for(const t of towers){

        ctx.fillStyle = "#888";

        ctx.fillRect(
            t.x - 20,
            t.y - 20,
            40,
            40
        );

        ctx.fillStyle = "white";
        ctx.fillText(
            "T",
            t.x - 4,
            t.y + 5
        );
    }

    for(const m of monsters){

        if(!m.captured){
            drawMonster(m);
        }
    }

    for(const b of balloons){

        if(b.hp <= 0) continue;
		        ctx.fillStyle = "red";

        ctx.beginPath();
        ctx.arc(
            b.x,
            b.y - 20,
            20,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "brown";

        ctx.fillRect(
            b.x - 12,
            b.y,
            24,
            24
        );

        ctx.fillStyle = "white";

        ctx.fillText(
            "HP:" + b.hp,
            b.x - 18,
            b.y - 35
        );
    }

    ctx.fillStyle = "orange";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

    requestAnimationFrame(draw);
}
function update(){

    movePlayer();

    requestAnimationFrame(update);
}

update();
draw();

</script>

</body>
</html>
