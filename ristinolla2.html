<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Ristinolla Kaksinpeli</title>
<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#222;
    color:white;
}

h1{
    margin-top:20px;
}

#status{
    margin:15px;
}

#board{
    width:306px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:3px;
}

.cell{
    width:100px;
    height:100px;
    background:#333;
    border:2px solid #555;
    font-size:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.cell:hover{
    background:#444;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>Ristinolla Kaksinpeli</h1>
<h2 id="status">Vuoro: X</h2>

<a href="ristinolla0.html" style="position: absolute; top: 10px; right: 20px; padding: 10px 14px; font-size: 16px; cursor: pointer; text-decoration: none; background-color: #f1f2f6; color: #333; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif;">
  ⬅️ Takaisin
</a>

<div id="board"></div>

<button onclick="resetGame()">Uusi peli</button>

<script>
const board = document.getElementById("board");
const statusText = document.getElementById("status");

let cells = ["","","","","","","","",""];
let currentPlayer = "X";
let gameOver = false;

for(let i=0;i<9;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.index = i;
    cell.addEventListener("click", makeMove);
    board.appendChild(cell);
}

function makeMove(){
    const index = this.dataset.index;

    if(cells[index] !== "" || gameOver) return;

    cells[index] = currentPlayer;
    this.textContent = currentPlayer;

    if(checkWinner(currentPlayer)){
        statusText.textContent = currentPlayer + " voitti!";
        gameOver = true;
        highlightWinner();
        return;
    }

    if(isDraw()){
        statusText.textContent = "Tasapeli!";
        gameOver = true;
        return;
    }

    currentPlayer = currentPlayer === "X" ? "O" : "X";
    statusText.textContent = "Vuoro: " + currentPlayer;
}

let winningCombo = null;

function checkWinner(player){
    const wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    for(const combo of wins){
        if(combo.every(i => cells[i] === player)){
            winningCombo = combo;
            return true;
        }
    }

    return false;
}

function highlightWinner(){
    if(!winningCombo) return;

    for(const i of winningCombo){
        board.children[i].style.background = "green";
    }
}

function isDraw(){
    return cells.every(cell => cell !== "");
}

function resetGame(){
    cells = ["","","","","","","","",""];
    currentPlayer = "X";
    gameOver = false;
    winningCombo = null;

    for(const cell of board.children){
        cell.textContent = "";
        cell.style.background = "#333";
    }

    statusText.textContent = "Vuoro: X";
}
</script>

</body>
</html>
