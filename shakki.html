<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Shakki</title>

<style>
body{
    background:#222;
    color:white;
    text-align:center;
    font-family:Arial;
}

h1{
    margin-top:10px;
}

#board{
    width:480px;
    height:480px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:4px solid #555;
}

.square{
    width:60px;
    height:60px;
    font-size:42px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
}

.white{
    background:#f0d9b5;
}

.black{
    background:#b58863;
}

.selected{
    outline:4px solid yellow;
}

#status{
    font-size:22px;
    margin-top:10px;
}

.black-piece{
    color:black;
}

.white-piece{
    color:white;
}
</style>
</head>
<body>

<a href="shakkimenu.html">
  <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<h1>♟️ Shakki ♘</h1>

<div id="status">Sinun vuorosi</div>
<div id="board"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
const game = new Chess();
const board = document.getElementById("board");
const statusText = document.getElementById("status");

let selected = null;

const pieces = {
    p:"♟︎",
    r:"♜",
    n:"♞",
    b:"♝",
    q:"♛",
    k:"♚",

    P:"♙",
    R:"♖",
    N:"♘",
    B:"♗",
    Q:"♕",
    K:"♔"
};

function drawBoard(){
    board.innerHTML="";

    const pos = game.board();

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){

            const sq=document.createElement("div");

            sq.className="square " +
                ((r+c)%2===0 ? "white":"black");

            const squareName =
                "abcdefgh"[c] + (8-r);

            sq.dataset.square=squareName;

            if(selected===squareName){
                sq.classList.add("selected");
            }

            const piece=pos[r][c];

            if(piece){
    let symbol = pieces[
        piece.color==="w"
        ? piece.type.toUpperCase()
        : piece.type
    ];

    sq.textContent = symbol;

    sq.classList.add(
        piece.color==="w"
        ? "white-piece"
        : "black-piece"
    );
}

            sq.onclick=()=>clickSquare(squareName);

            board.appendChild(sq);
        }
    }
}

function clickSquare(square){

    if(game.turn()!=="w") return;

    const piece = game.get(square);

    if(selected===null){

        if(piece && piece.color==="w"){
            selected=square;
            drawBoard();
        }

        return;
    }

    const move = game.move({
        from:selected,
        to:square,
        promotion:"q"
    });

    selected=null;

    if(move){
        drawBoard();
        checkGame();

        if(!game.game_over()){
            setTimeout(robotMove,500);
        }
    }else{
        drawBoard();
    }
}

function robotMove(){

    const moves = game.moves();

    if(moves.length===0) return;

    const randomMove =
        moves[Math.floor(Math.random()*moves.length)];

    game.move(randomMove);

    drawBoard();
    checkGame();
}

function checkGame(){

    if(game.in_checkmate()){

        if(game.turn()==="w"){
            statusText.textContent="🤖 Robotti voitti!";
        }else{
            statusText.textContent="🎉 Voitit!";
        }

        return;
    }

    if(game.in_draw()){
        statusText.textContent="Tasapeli!";
        return;
    }

    if(game.turn()==="w"){
        statusText.textContent="Sinun vuorosi";
    }else{
        statusText.textContent="Robotin vuoro";
    }
}

drawBoard();
</script>

</body>
</html>
