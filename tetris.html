<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    position:absolute;
    right:350px;
    top:10px;
    margin:0;
}

#score{
    position:absolute;
    right:350px;
    top:60px;
    font-size:24px;
}

canvas{
    background:black;
    border:3px solid white;
    margin-top:10px;
}

</style>
</head>
<body>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
  <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<h1>🧱 Tetris</h1>
<div id="score">Pisteet: 0</div>

<canvas id="game" width="300" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

let score = 0;

const colors = [
    null,
    "#00FFFF",
    "#0000FF",
    "#FF8800",
    "#FFFF00",
    "#00FF00",
    "#AA00FF",
    "#FF0000"
];

function createMatrix(w,h){
    const matrix=[];
    while(h--){
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

const arena=createMatrix(COLS,ROWS);

function createPiece(type){

    if(type==="T"){
        return [
            [0,6,0],
            [6,6,6],
            [0,0,0]
        ];
    }

    if(type==="O"){
        return [
            [4,4],
            [4,4]
        ];
    }

    if(type==="L"){
        return [
            [0,3,0],
            [0,3,0],
            [0,3,3]
        ];
    }

    if(type==="J"){
        return [
            [0,2,0],
            [0,2,0],
            [2,2,0]
        ];
    }

    if(type==="I"){
        return [
            [0,1,0,0],
            [0,1,0,0],
            [0,1,0,0],
            [0,1,0,0]
        ];
    }

    if(type==="S"){
        return [
            [0,5,5],
            [5,5,0],
            [0,0,0]
        ];
    }

    if(type==="Z"){
        return [
            [7,7,0],
            [0,7,7],
            [0,0,0]
        ];
    }
}

const player={
    pos:{x:0,y:0},
    matrix:null
};

function collide(arena,player){
    const m=player.matrix;
    const o=player.pos;

    for(let y=0;y<m.length;y++){
        for(let x=0;x<m[y].length;x++){
            if(
                m[y][x]!==0 &&
                (
                    arena[y+o.y] &&
                    arena[y+o.y][x+o.x]
                )!==0
            ){
                return true;
            }
        }
    }

    return false;
}

function merge(arena,player){
    player.matrix.forEach((row,y)=>{
        row.forEach((value,x)=>{
            if(value!==0){
                arena[y+player.pos.y][x+player.pos.x]=value;
            }
        });
    });
}

function arenaSweep(){
    let rowCount=1;

    outer:
    for(let y=arena.length-1;y>0;y--){

        for(let x=0;x<arena[y].length;x++){
            if(arena[y][x]===0){
                continue outer;
            }
        }

        const row=arena.splice(y,1)[0].fill(0);
        arena.unshift(row);
        y++;

        score+=10*rowCount;
        rowCount*=2;
    }

    document.getElementById("score").textContent=
        "Pisteet: "+score;
}

function playerDrop(){
    player.pos.y++;

    if(collide(arena,player)){
        player.pos.y--;
        merge(arena,player);
        playerReset();
        arenaSweep();
    }

    dropCounter=0;
}

function playerMove(dir){
    player.pos.x+=dir;

    if(collide(arena,player)){
        player.pos.x-=dir;
    }
}

function rotate(matrix){
    for(let y=0;y<matrix.length;y++){
        for(let x=0;x<y;x++){
            [
                matrix[x][y],
                matrix[y][x]
            ]=[
                matrix[y][x],
                matrix[x][y]
            ];
        }
    }

    matrix.forEach(row=>row.reverse());
}

function playerRotate(){
    const pos=player.pos.x;

    rotate(player.matrix);

    if(collide(arena,player)){
        player.pos.x=pos;
    }
}

function playerReset(){

    const pieces="TJLOSZI";

    player.matrix=
        createPiece(
            pieces[
                Math.floor(
                    Math.random()*pieces.length
                )
            ]
        );

    player.pos.y=0;
    player.pos.x=
        ((COLS/2)|0)-
        ((player.matrix[0].length/2)|0);

    if(collide(arena,player)){
        arena.forEach(row=>row.fill(0));
        score=0;
        document.getElementById("score").textContent=
            "Pisteet: 0";
    }
}

function drawMatrix(matrix,offset){

    matrix.forEach((row,y)=>{
        row.forEach((value,x)=>{

            if(value!==0){
                ctx.fillStyle=colors[value];

                ctx.fillRect(
                    (x+offset.x)*SIZE,
                    (y+offset.y)*SIZE,
                    SIZE,
                    SIZE
                );

                ctx.strokeStyle="#000";
                ctx.strokeRect(
                    (x+offset.x)*SIZE,
                    (y+offset.y)*SIZE,
                    SIZE,
                    SIZE
                );
            }
        });
    });
}

function draw(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawMatrix(arena,{x:0,y:0});
    drawMatrix(player.matrix,player.pos);
}

let dropCounter=0;
let dropInterval=700;
let lastTime=0;

function update(time=0){

    const delta=time-lastTime;
    lastTime=time;

    dropCounter+=delta;

    if(dropCounter>dropInterval){
        playerDrop();
    }

    draw();

    requestAnimationFrame(update);
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft"){
        playerMove(-1);
    }

    if(e.key==="ArrowRight"){
        playerMove(1);
    }

    if(e.key==="ArrowDown"){
        playerDrop();
    }

    if(e.key==="ArrowUp"){
        playerRotate();
    }
});

playerReset();
update();
</script>

</body>
</html>
