<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>HuOno</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#0a5c2a;
    color:white;
    text-align:center;
}

#topCard{
    width:120px;
    height:180px;
    margin:20px auto;
    border-radius:15px;
    border:4px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    font-weight:bold;
}

#hand{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.card{
    width:80px;
    height:120px;
    border-radius:12px;
    border:3px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
}

.red{background:#d32f2f;}
.blue{background:#1976d2;}
.green{background:#388e3c;}
.yellow{background:#fbc02d;color:black;}

button{
    padding:10px 20px;
    font-size:18px;
    margin:10px;
}

#info{
    font-size:22px;
    margin:15px;
}
</style>
</head>
<body>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
  <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<h1>HuOno</h1>

<div id="info">Sinun vuorosi</div>

<div id="topCard"></div>

<button id="drawBtn">Nosta kortti</button>

<h2>Sinun korttisi</h2>
<div id="hand"></div>

<script>

const colors = ["red","blue","green","yellow"];

function createDeck(){
    const deck=[];
    for(const color of colors){
        for(let i=0;i<=9;i++){
            deck.push({color,value:i});
            deck.push({color,value:i});
        }
    }
    return shuffle(deck);
}

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

let deck=createDeck();

const players=[
    [],
    [],
    [],
    []
];

for(let p=0;p<4;p++){
    for(let i=0;i<7;i++){
        players[p].push(deck.pop());
    }
}

let topCard=deck.pop();

const topCardDiv=document.getElementById("topCard");
const handDiv=document.getElementById("hand");
const info=document.getElementById("info");
const drawBtn=document.getElementById("drawBtn");

let currentPlayer=0;

function updateTopCard(){
    topCardDiv.className=topCard.color;
    topCardDiv.textContent=topCard.value;
}

function renderHand(){

    handDiv.innerHTML="";

    players[0].forEach((card,index)=>{

        const div=document.createElement("div");
        div.className="card "+card.color;
        div.textContent=card.value;

        div.onclick=()=>playCard(index);

        handDiv.appendChild(div);
    });

    updateTopCard();
}

function canPlay(card){
    return (
        card.color===topCard.color ||
        card.value===topCard.value
    );
}

function playCard(index){

    if(currentPlayer!==0) return;

    const card=players[0][index];

    if(!canPlay(card)) return;

    topCard=card;
    players[0].splice(index,1);

    if(players[0].length===0){
        alert("Voitit!");
        location.reload();
        return;
    }

    nextPlayer();
}

drawBtn.onclick=()=>{

    if(currentPlayer!==0) return;

    players[0].push(deck.pop());

    renderHand();
    nextPlayer();
};

function nextPlayer(){

    currentPlayer=(currentPlayer+1)%4;

    renderHand();

    if(currentPlayer===0){
        info.textContent="Sinun vuorosi";
        return;
    }

    botTurn();
}

function botTurn(){

    const hand=players[currentPlayer];

    let played=false;

    for(let i=0;i<hand.length;i++){

        if(canPlay(hand[i])){

            topCard=hand[i];
            hand.splice(i,1);

            played=true;
            break;
        }
    }

    if(!played){
        if(deck.length){
            hand.push(deck.pop());
        }
    }

    if(hand.length===0){
        alert("Botti "+currentPlayer+" voitti!");
        location.reload();
        return;
    }

    info.textContent="Botti "+currentPlayer+
        " ("+hand.length+" korttia)";

    renderHand();

    setTimeout(()=>{
        currentPlayer=(currentPlayer+1)%4;

        if(currentPlayer===0){
            info.textContent="Sinun vuorosi";
            renderHand();
        }else{
            botTurn();
        }
    },1000);
}

renderHand();

</script>

</body>
</html>
