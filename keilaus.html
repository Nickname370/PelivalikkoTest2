<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keilaus</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(#87ceeb,#cfcfcf);
    font-family:Arial,sans-serif;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    text-shadow:2px 2px 4px black;
}

#restartBtn{
    position:absolute;
    top:50px;
    left:10px;
    padding:10px 15px;
    font-size:18px;
    cursor:pointer;
    display:none;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
  <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<div id="ui">
Kaadetut keilat: <span id="score">0</span>/10
</div>

<button id="restartBtn">🔄 Uusi peli</button>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreText=document.getElementById("score");
const restartBtn=document.getElementById("restartBtn");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let score=0;

const ball={
    x:0,
    y:0,
    r:18,
    vx:0,
    vy:0,
    moving:false
};

function resetBall(){
    ball.x=canvas.width/2;
    ball.y=canvas.height-100;
    ball.vx=0;
    ball.vy=0;
    ball.moving=false;
}

const pins=[];

function resetPins(){

    pins.length=0;

    const center=canvas.width/2;
    const startY=120;

    let row=1;

    for(let r=0;r<4;r++){

        for(let i=0;i<row;i++){

            pins.push({
                x:center-(row-1)*20+i*40,
                y:startY+r*40,
                alive:true
            });

        }

        row++;
    }
}

function newGame(){

    score=0;
    scoreText.textContent=score;

    resetBall();
    resetPins();

    restartBtn.style.display="none";
}

newGame();

let mouseX=0;

canvas.addEventListener("mousemove",e=>{
    mouseX=e.clientX;
});

canvas.addEventListener("click",()=>{

    if(ball.moving) return;

    const dx=(mouseX-ball.x)*0.08;

    ball.vx=dx;
    ball.vy=-15;

    ball.moving=true;
});

restartBtn.onclick=newGame;

function drawLane(){

    ctx.fillStyle="#b07a3f";

    ctx.fillRect(
        canvas.width/2-160,
        50,
        320,
        canvas.height-120
    );

    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    ctx.strokeRect(
        canvas.width/2-160,
        50,
        320,
        canvas.height-120
    );
}

function drawPins(){

    for(const pin of pins){

        if(!pin.alive) continue;

        ctx.fillStyle="white";

        ctx.fillRect(
            pin.x-8,
            pin.y-20,
            16,
            40
        );

        ctx.beginPath();
        ctx.arc(
            pin.x,
            pin.y-20,
            8,
            0,
            Math.PI*2
        );
        ctx.fill();
    }
}

function updateBall(){

    if(!ball.moving) return;

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    ball.vx*=0.995;
    ball.vy*=0.995;

    if(ball.y<50){

        ball.moving=false;

        setTimeout(()=>{
            resetBall();
        },500);
    }
}

function checkHits(){

    for(const pin of pins){

        if(!pin.alive) continue;

        const dist=Math.hypot(
            ball.x-pin.x,
            ball.y-pin.y
        );

        if(dist<25){

            pin.alive=false;

            score++;
            scoreText.textContent=score;
        }
    }
}

function drawBall(){

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();
}

function drawAim(){

    if(ball.moving) return;

    ctx.strokeStyle="red";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(ball.x,ball.y);
    ctx.lineTo(mouseX,ball.y-100);

    ctx.stroke();
}

function drawWin(){

    if(score!==10) return;

    ctx.fillStyle="gold";
    ctx.font="80px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        "STRIKE!",
        canvas.width/2,
        canvas.height/2
    );

    restartBtn.style.display="block";
}

function gameLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawLane();

    updateBall();
    checkHits();

    drawPins();
    drawBall();
    drawAim();
    drawWin();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
