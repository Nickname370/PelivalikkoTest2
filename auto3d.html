<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<title>Kaahaaja</title>
<style>
body { margin: 0; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>

<p>Liiku = WASD</p>

  <a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
    <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
  </a>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let car;

let moveForward = false;
let moveBackward = false;
let turnLeft = false;
let turnRight = false;

// 🚗 liike
let velocity = 0;
let angleVelocity = 0;

// 🌀 drift sivuliike
let sideVelocity = 0;

// ⚙️ grip (mitä pienempi, sitä enemmän drift)
let grip = 0.88;

// boost
let boost = 1;
let boostTimer = 0;

let ramps = [];
let boosts = [];

let verticalVelocity = 0;
let grounded = true;

init();
animate();

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 12);

    renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);

    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 500),
        new THREE.MeshStandardMaterial({ color: 0x228b22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    car = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 2),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    car.position.y = 1;
    scene.add(car);

    for (let i = 0; i < 15; i++) spawnRamp();
    for (let i = 0; i < 20; i++) spawnBoost();

    document.addEventListener("keydown", onKeyDown);
    document.addEventListener("keyup", onKeyUp);

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function spawnRamp() {

    const ramp = new THREE.Mesh(
        new THREE.BoxGeometry(8, 2, 14),
        new THREE.MeshStandardMaterial({ color: 0x888888 })
    );

    ramp.position.set(
        (Math.random() - 0.5) * 200,
        1,
        (Math.random() - 0.5) * 200
    );

    ramp.rotation.x = -0.35;
    ramp.rotation.y = Math.random() * Math.PI;

    scene.add(ramp);
    ramps.push(ramp);
}

function spawnBoost() {
    const b = new THREE.Mesh(
        new THREE.BoxGeometry(2, 0.1, 10),
        new THREE.MeshStandardMaterial({ color: 0xffff00 })
    );

    b.position.set(
        (Math.random() - 0.5) * 200,
        0.6,
        (Math.random() - 0.5) * 200
    );

    b.rotation.y = Math.random() * Math.PI;

    scene.add(b);
    boosts.push(b);
}

function onKeyDown(e) {
    if (e.key === "w") moveForward = true;
    if (e.key === "s") moveBackward = true;
    if (e.key === "a") turnLeft = true;
    if (e.key === "d") turnRight = true;
}

function onKeyUp(e) {
    if (e.key === "w") moveForward = false;
    if (e.key === "s") moveBackward = false;
    if (e.key === "a") turnLeft = false;
    if (e.key === "d") turnRight = false;
}

function animate() {
    requestAnimationFrame(animate);

    // 🚀 boost
    if (boostTimer > 0) {
        boostTimer--;
        if (boostTimer === 0) boost = 1;
    }

    // kiihdytys
    if (moveForward) velocity += 0.02 * boost;
    if (moveBackward) velocity -= 0.02;

    velocity *= 0.96;

    // 🌀 DRIFT LOGIIKKA (PAREMPI)

    const turning = (turnLeft || turnRight);
    const speedFactor = Math.min(Math.abs(velocity), 1);

    // kääntö = enemmän drift jos vauhtia
    let turnStrength = (turnRight ? -1 : 1) * 0.01 * speedFactor;

    if (turning) {
        angleVelocity += turnStrength;

        // sivudrift kasvaa nopeudesta
        sideVelocity += turnStrength * 0.5;
    } else {
        // palauttaa hallinnan
        angleVelocity *= 0.85;
    }

    // grip vähentää sivuliukua
    sideVelocity *= grip;

    // päivitä kulma
    car.rotation.y += angleVelocity;

    // liikesuunta
    const forwardX = -Math.sin(car.rotation.y);
    const forwardZ = -Math.cos(car.rotation.y);

    const rightX = Math.cos(car.rotation.y);
    const rightZ = -Math.sin(car.rotation.y);

    car.position.x += forwardX * velocity + rightX * sideVelocity;
    car.position.z += forwardZ * velocity + rightZ * sideVelocity;

    // gravity
    verticalVelocity -= 0.015;

    car.position.y += verticalVelocity;

    // maa
    if(car.position.y <= 1){
        car.position.y = 1;
        verticalVelocity = 0;
        grounded = true;
    } else {
        grounded = false;
    }

       // 🚀 rampit oikealla hypyllä
    for (let r of ramps) {

        const dx = car.position.x - r.position.x;
        const dz = car.position.z - r.position.z;

        const dist = Math.sqrt(dx*dx + dz*dz);

        if (dist < 7 && grounded) {

            verticalVelocity = 0.45 + Math.abs(velocity) * 0.25;

            velocity += 0.08;
        }
    }

    // ⚡ boostit
    for (let b of boosts) {
        const dx = car.position.x - b.position.x;
        const dz = car.position.z - b.position.z;
        const dist = Math.sqrt(dx*dx + dz*dz);

        if (dist < 6) {
            boost = 2.3;
            boostTimer = 80;
        }
    }

    // 📷 kamera
    const offset = new THREE.Vector3(0, 6, 12);
    offset.applyAxisAngle(new THREE.Vector3(0,1,0), car.rotation.y);

    camera.position.x = car.position.x + offset.x;
    camera.position.y = car.position.y + offset.y;
    camera.position.z = car.position.z + offset.z;

    camera.lookAt(car.position);

    renderer.render(scene, camera);
}
</script>

</body>
</html>
