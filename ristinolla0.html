<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ristinolla</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#222;
    font-family:Arial,sans-serif;
    color:white;
}

.menu{
    text-align:center;
}

h1{
    font-size:65px;
    margin-bottom:30px;
    text-shadow:0 0 15px cyan;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:8px;
    margin:0 auto 30px;
    width:max-content;
}

.cell{
    width:80px;
    height:80px;
    background:#333;
    border:3px solid #555;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    font-weight:bold;
}

.x{
    color:#4fc3f7;
}

.o{
    color:#ff6b6b;
}

button{
    display:block;
    width:290px;
    margin:12px auto;
    padding:10px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#444;
    color:white;
    transition:0.2s;
}

button:hover{
    background:#666;
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="menu">

    <h1>RISTINOLLA</h1>

    <div class="grid">
        <div class="cell x">X</div>
        <div class="cell o">O</div>
        <div class="cell"></div>

        <div class="cell o">O</div>
        <div class="cell x">X</div>
        <div class="cell"></div>

        <div class="cell o">O</div>
        <div class="cell x">X</div>
        <div class="cell x">X</div>
    </div>

    <button onclick="location.href='ristinolla.html'">
        🤖 Pelaa bottia vastaan
    </button>

    <button onclick="location.href='ristinolla2.html'">
        👥 Kaksinpeli
    </button>
	
	<button onclick="location.href='index.html'">
        ⬅️ Takaisin
    </button>

</div>

</body>
</html>
