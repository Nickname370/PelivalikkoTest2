<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Ristinolla vs Botti</title>
<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#222;
    color:white;
}

h1{
    margin-top:20px;
}

#board{
    width:306px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:3px;
}

.cell{
    width:100px;
    height:100px;
    background:#333;
    border:2px solid #555;
    font-size:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.cell:hover{
    background:#444;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>Ristinolla vs Botti</h1>
<h2 id="status">Sinun vuorosi (X)</h2>

<a href="ristinolla0.html" style="position: absolute; top: 10px; right: 20px; padding: 10px 14px; font-size: 16px; cursor: pointer; text-decoration: none; background-color: #f1f2f6; color: #333; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif;">
  ⬅️ Takaisin
</a>

<div id="board"></div>

<button onclick="resetGame()">Uusi peli</button>

<script>
const board = document.getElementById("board");
const statusText = document.getElementById("status");

let cells = ["","","","","","","","",""];
let gameOver = false;

for(let i=0;i<9;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.index = i;
    cell.onclick = playerMove;
    board.appendChild(cell);
}

function playerMove(){
    const index = this.dataset.index;

    if(cells[index] !== "" || gameOver) return;

    cells[index] = "X";
    this.textContent = "X";

    if(checkWinner("X")){
        statusText.textContent = "Voitit!";
        gameOver = true;
        return;
    }

    if(isDraw()){
        statusText.textContent = "Tasapeli!";
        gameOver = true;
        return;
    }

    statusText.textContent = "Botti miettii...";

    setTimeout(botMove, 500);
}

function botMove(){
    if(gameOver) return;

    let empty = [];

    for(let i=0;i<9;i++){
        if(cells[i] === "") empty.push(i);
    }

    const move = empty[Math.floor(Math.random()*empty.length)];

    cells[move] = "O";
    board.children[move].textContent = "O";

    if(checkWinner("O")){
        statusText.textContent = "Botti voitti!";
        gameOver = true;
        return;
    }

    if(isDraw()){
        statusText.textContent = "Tasapeli!";
        gameOver = true;
        return;
    }

    statusText.textContent = "Sinun vuorosi (X)";
}

function checkWinner(player){
    const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    return wins.some(combo =>
        combo.every(index => cells[index] === player)
    );
}

function isDraw(){
    return cells.every(cell => cell !== "");
}

function resetGame(){
    cells = ["","","","","","","","",""];
    gameOver = false;

    for(let cell of board.children){
        cell.textContent = "";
    }

    statusText.textContent = "Sinun vuorosi (X)";
}
</script>

</body>
</html>
